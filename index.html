<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max Harnot – Landscape Photography</title>
<meta name="description" content="Max Harnot – Landscape Photography. Contact: maxharnot@gmail.com, Instagram @maxharnot">
<meta property="og:title" content="Max Harnot – Landscape Photography">
<meta property="og:image" content="hero.jpg">
<style>
  :root { --fg:#f4f1ea; --muted:rgba(244,241,234,.72); --line:rgba(244,241,234,.28); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color:var(--fg); background:#111;
    -webkit-font-smoothing:antialiased;
  }
  .hero {
    position:relative; min-height:100svh; display:flex; flex-direction:column; justify-content:flex-end;
    padding:28px 24px 28px;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.15) 0%, rgba(0,0,0,.25) 40%, rgba(0,0,0,.82) 100%),
      url("hero.jpg") center/cover no-repeat, #2a2f33;
  }
  @media (min-aspect-ratio: 3/4) {
    body { background:#0c0c0c; }
    .hero { max-width:calc(100svh * 0.6667); margin:0 auto; }
  }
  .wrap { max-width:560px; width:100%; margin:0 auto; }
  .kicker { font-size:12px; letter-spacing:.28em; text-transform:uppercase; color:var(--muted); }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight:400; font-size:clamp(40px, 11vw, 64px); line-height:1.02; margin:10px 0 18px; }
  .bio { font-size:16px; line-height:1.55; color:var(--muted); margin-bottom:26px; }
  .hello { font-size:16px; line-height:1.45; color:var(--fg); margin-bottom:12px; }
  .actions { display:flex; flex-direction:column; gap:10px; margin-bottom:30px; }
  .btn {
    display:flex; align-items:center; justify-content:space-between;
    padding:15px 18px; border:1px solid var(--line); border-radius:2px;
    color:var(--fg); text-decoration:none; font-size:15px; letter-spacing:.02em;
    background:rgba(0,0,0,.25); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:background .2s, border-color .2s;
  }
  .btn:hover, .btn:focus-visible { background:rgba(244,241,234,.1); border-color:var(--fg); }
  .btn span:last-child { color:var(--muted); font-size:14px; }
  .expo { border-top:1px solid var(--line); padding-top:18px; font-size:14px; line-height:1.6; color:var(--muted); }
  .expo strong { display:block; color:var(--fg); font-weight:400; font-family: Georgia, serif; font-size:18px; line-height:1.35; margin-bottom:6px; }
  .lang { display:flex; flex-wrap:wrap; gap:4px; margin-top:22px; }
  .lang button {
    background:none; border:1px solid transparent; color:rgba(244,241,234,.55);
    font:inherit; font-size:11px; letter-spacing:.12em; padding:5px 7px; cursor:pointer; border-radius:2px;
  }
  .lang button[aria-pressed="true"] { color:var(--fg); border-color:var(--line); }
  footer { font-size:11px; color:rgba(244,241,234,.45); margin-top:14px; letter-spacing:.04em; }
</style>
</head>
<body>
<main class="hero">
  <div class="wrap">
    <p class="kicker" data-i18n="kicker"></p>
    <h1>Max Harnot</h1>
    <p class="bio" data-i18n="bio"></p>

    <p class="hello" data-i18n="hello"></p>

    <div class="actions">
      <a class="btn" href="mailto:maxharnot@gmail.com">
        <span data-i18n="mail"></span><span>maxharnot@gmail.com</span>
      </a>
      <a class="btn" href="https://www.instagram.com/maxharnot/" target="_blank" rel="noopener">
        <span>Instagram</span><span>@maxharnot</span>
      </a>
    </div>

    <div class="expo">
      <strong>Fascination of Light.<br>The Art of Landscape Photography</strong>
      <span data-i18n="expo"></span><br>
      <span data-i18n="dates"></span>
    </div>

    <nav class="lang" aria-label="Language">
      <button type="button" data-set="de">DE</button>
      <button type="button" data-set="en">EN</button>
      <button type="button" data-set="pl">PL</button>
      <button type="button" data-set="es">ES</button>
      <button type="button" data-set="pt">PT</button>
      <button type="button" data-set="it">IT</button>
      <button type="button" data-set="fr">FR</button>
    </nav>
    <footer>© 2026 Max Harnot</footer>
  </div>
</main>
<script>
  var T = {
    de: { kicker:"Landschaftsfotografie", mail:"E-Mail",
          hello:"Ich freue mich, von Ihnen zu hören!",
          bio:"Seit neun Jahren fotografiere ich Landschaften und Berge. Mich fasziniert das Licht, das eine Landschaft für wenige Minuten verwandelt, und die Planung, die nötig ist, um genau diesen Moment einzufangen.",
          expo:"Ausstellung · Immathalle der TUM, München", dates:"10.–22. November 2026 · täglich 10–19 Uhr" },
    en: { kicker:"Landscape Photography", mail:"E-mail",
          hello:"I'd love to hear from you!",
          bio:"For nine years I have been photographing landscapes and mountains. What fascinates me is the light that transforms a landscape for just a few minutes, and the planning it takes to capture exactly that moment.",
          expo:"Exhibition · Immathalle, TUM, Munich", dates:"10–22 November 2026 · daily 10 am – 7 pm" },
    pl: { kicker:"Fotografia krajobrazowa", mail:"E-mail",
          hello:"Będzie mi miło, jeśli się odezwiesz!",
          bio:"Od dziewięciu lat fotografuję krajobrazy i góry. Fascynuje mnie światło, które na kilka minut odmienia krajobraz, a także planowanie, którego wymaga uchwycenie właśnie tej chwili.",
          expo:"Wystawa · Immathalle TUM, Monachium", dates:"10–22 listopada 2026 · codziennie 10–19" },
    es: { kicker:"Fotografía de paisaje", mail:"Correo",
          hello:"¡Me encantará saber de ti!",
          bio:"Desde hace nueve años fotografío paisajes y montañas. Me fascina la luz que transforma un paisaje durante apenas unos minutos, así como la planificación necesaria para captar justo ese momento.",
          expo:"Exposición · Immathalle, TUM, Múnich", dates:"10–22 de noviembre de 2026 · todos los días 10–19 h" },
    pt: { kicker:"Fotografia de paisagem", mail:"E-mail",
          hello:"Vou adorar receber sua mensagem!",
          bio:"Há nove anos fotografo paisagens e montanhas. Me fascina a luz que transforma uma paisagem por apenas alguns minutos, assim como o planejamento necessário para capturar exatamente esse momento.",
          expo:"Exposição · Immathalle, TUM, Munique", dates:"10–22 de novembro de 2026 · diariamente, 10h–19h" },
    it: { kicker:"Fotografia di paesaggio", mail:"E-mail",
          hello:"Sarò felice di ricevere un tuo messaggio!",
          bio:"Da nove anni fotografo paesaggi e montagne. Mi affascina la luce che per pochi minuti trasforma un paesaggio, così come la pianificazione necessaria per cogliere proprio quel momento.",
          expo:"Mostra · Immathalle, TUM, Monaco di Baviera", dates:"10–22 novembre 2026 · tutti i giorni 10–19" },
    fr: { kicker:"Photographie de paysage", mail:"E-mail",
          hello:"Je serai ravi de recevoir votre message\u202F!",
          bio:"Depuis neuf ans, je photographie des paysages et des montagnes. Ce qui me fascine, c'est la lumière qui transforme un paysage pendant quelques minutes à peine, ainsi que la préparation nécessaire pour saisir précisément cet instant.",
          expo:"Exposition · Immathalle, TUM, Munich", dates:"10–22 novembre 2026 · tous les jours 10h–19h" }
  };
  function setLang(l) {
    if (!T[l]) l = "en";
    document.documentElement.lang = l;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T[l][el.dataset.i18n]; });
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.set === l ? "true" : "false");
    });
    try { localStorage.setItem("lang", l); } catch (e) {}
  }
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("lang"); } catch (e) {}
    var pick = saved;
    if (!pick) {
      var prefs = navigator.languages || [navigator.language || "en"];
      for (var i = 0; i < prefs.length && !pick; i++) {
        var c = (prefs[i] || "").slice(0, 2).toLowerCase();
        if (T[c]) pick = c;
      }
    }
    setLang(pick || "en");
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.addEventListener("click", function () { setLang(b.dataset.set); });
    });
  })();
</script>
</body>
</html>
