<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max Harnot – Landscape Photography</title>
<meta name="description" content="Max Harnot – Landscape Photography. Contact: maxharnot@gmail.com, Instagram @maxharnot">
<meta property="og:type" content="website">
<meta property="og:url" content="https://maxharnot.github.io/">
<meta property="og:title" content="Max Harnot – Landscape Photography">
<meta property="og:description" content="Exhibition “Fascination of Light. The Art of Landscape Photography” · Immathalle, TUM, Munich · 10–22 November 2026. Contact: E-mail &amp; Instagram.">
<meta property="og:image" content="https://maxharnot.github.io/hero.jpg">
<meta property="og:image:width" content="1667">
<meta property="og:image:height" content="2500">
<style>
  :root { --fg:#f4f1ea; --muted:rgba(244,241,234,.72); --line:rgba(244,241,234,.28); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color:var(--fg); background:#111;
    -webkit-font-smoothing:antialiased;
  }
  .hero {
    position:relative; min-height:100svh; display:flex; flex-direction:column; justify-content:flex-end;
    padding:28px 24px 28px;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.15) 0%, rgba(0,0,0,.25) 40%, rgba(0,0,0,.82) 100%),
      url("hero.jpg") center/cover no-repeat, #2a2f33;
  }
  @media (min-aspect-ratio: 3/4) {
    body { background:#0c0c0c; }
    .hero, .more { max-width:calc(100svh * 0.6667); margin:0 auto; }
  }
  .wrap { max-width:560px; width:100%; margin:0 auto; }
  .kicker { font-size:12px; letter-spacing:.28em; text-transform:uppercase; color:var(--muted); }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight:400; font-size:clamp(40px, 11vw, 64px); line-height:1.02; margin:10px 0 18px; }
  .bio { font-size:16px; line-height:1.55; color:var(--muted); margin-bottom:26px; }
  .hello { font-size:16px; line-height:1.45; color:var(--fg); margin-bottom:12px; }
  .actions { display:flex; flex-direction:column; gap:10px; margin-bottom:30px; }
  .btn {
    display:flex; align-items:center; justify-content:space-between;
    padding:15px 18px; border:1px solid var(--line); border-radius:2px;
    color:var(--fg); text-decoration:none; font-size:15px; letter-spacing:.02em;
    background:rgba(0,0,0,.25); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:background .2s, border-color .2s;
  }
  .btn:hover, .btn:focus-visible { background:rgba(244,241,234,.1); border-color:var(--fg); }
  .btn span:last-child { color:var(--muted); font-size:14px; }
  .expo { border-top:1px solid var(--line); padding-top:18px; font-size:14px; line-height:1.6; color:var(--muted); }
  .expo strong { display:block; color:var(--fg); font-weight:400; font-family: Georgia, serif; font-size:18px; line-height:1.35; margin-bottom:6px; }
  .to-gallery { margin-top:18px; }
  .more { padding:40px 24px 28px; background:#111; }
  .more h2 { font-weight:400; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:start; }
  .grid a { display:block; }
  .grid img { display:block; width:100%; height:auto; }
  .lb { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
        padding:16px; background:rgba(8,8,8,.95); cursor:zoom-out; outline:none; }
  .lb[hidden] { display:none; }
  .lb img { max-width:100%; max-height:100%; object-fit:contain; }
  .lang {
    position:absolute; top:16px; right:16px; padding:6px 9px;
    font-size:11px; letter-spacing:.12em; color:var(--fg);
    border:1px solid var(--line); border-radius:2px; background:rgba(0,0,0,.25);
  }
  .lang-flag { font-size:15px; line-height:1; vertical-align:-2px; }
  .lang select { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:16px; }
  .lang:focus-within { border-color:var(--fg); }
  .more footer { margin-top:28px; }
  footer { font-size:11px; color:rgba(244,241,234,.45); margin-top:14px; letter-spacing:.04em; }
</style>
</head>
<body>
<main class="hero">
  <label class="lang"><span class="lang-flag" aria-hidden="true">🇩🇪</span> <span class="lang-code" aria-hidden="true">DE</span> ▾
    <select aria-label="Language / Sprache">
      <option value="de">🇩🇪 Deutsch</option>
      <option value="en">🇬🇧 English</option>
      <option value="pl">🇵🇱 Polski</option>
      <option value="es">🇪🇸 Español</option>
      <option value="pt">🇧🇷 Português</option>
      <option value="it">🇮🇹 Italiano</option>
      <option value="fr">🇫🇷 Français</option>
    </select>
  </label>
  <div class="wrap">
    <p class="kicker" data-i18n="kicker"></p>
    <h1>Max Harnot</h1>
    <p class="bio" data-i18n="bio"></p>

    <p class="hello" data-i18n="hello"></p>

    <div class="actions">
      <a class="btn" href="mailto:maxharnot@gmail.com">
        <span data-i18n="mail"></span><span>maxharnot@gmail.com</span>
      </a>
      <a class="btn" href="https://www.instagram.com/maxharnot/" target="_blank" rel="noopener">
        <span>Instagram</span><span>@maxharnot</span>
      </a>
      <a class="btn" href="max-harnot.vcf" download="max-harnot.vcf">
        <span data-i18n="save"></span><span>vCard</span>
      </a>
    </div>

    <div class="expo">
      <strong>Fascination of Light.<br><span data-i18n="subtitle"></span></strong>
      <span data-i18n="expo"></span><br>
      <span data-i18n="dates"></span>
    </div>

    <a class="btn to-gallery" href="#galerie">
      <span data-i18n="seeGallery"></span><span aria-hidden="true">↓</span>
    </a>

  </div>
</main>

<section class="more" id="galerie">
  <div class="wrap">
    <h2 class="kicker" data-i18n="gallery"></h2>
    <div class="grid">
        <a href="gallery/01.jpg"><img src="gallery/01-thumb.jpg" width="400" height="600" alt="Max Harnot – 1" loading="lazy"></a>
        <a href="gallery/02.jpg"><img src="gallery/02-thumb.jpg" width="400" height="600" alt="Max Harnot – 2" loading="lazy"></a>
        <a href="gallery/03.jpg"><img src="gallery/03-thumb.jpg" width="600" height="400" alt="Max Harnot – 3" loading="lazy"></a>
        <a href="gallery/04.jpg"><img src="gallery/04-thumb.jpg" width="600" height="400" alt="Max Harnot – 4" loading="lazy"></a>
        <a href="gallery/05.jpg"><img src="gallery/05-thumb.jpg" width="400" height="600" alt="Max Harnot – 5" loading="lazy"></a>
        <a href="gallery/06.jpg"><img src="gallery/06-thumb.jpg" width="400" height="600" alt="Max Harnot – 6" loading="lazy"></a>
        <a href="gallery/07.jpg"><img src="gallery/07-thumb.jpg" width="600" height="400" alt="Max Harnot – 7" loading="lazy"></a>
        <a href="gallery/08.jpg"><img src="gallery/08-thumb.jpg" width="600" height="400" alt="Max Harnot – 8" loading="lazy"></a>
    </div>

    <footer>© 2026 Max Harnot</footer>
  </div>
</section>

<div class="lb" hidden role="dialog" aria-modal="true" tabindex="-1"><img alt=""></div>
<script>
  var T = {
    de: { kicker:"Landschaftsfotografie", subtitle:"Die Kunst der Landschaftsfotografie", mail:"E-Mail", save:"Kontakt speichern",
          gallery:"Auswahl aus der Ausstellung", seeGallery:"Bilder aus der Ausstellung",
          hello:"Ich freue mich, von Ihnen zu hören!",
          bio:"Seit neun Jahren fotografiere ich Landschaften und Berge. Mich fasziniert das Licht, das eine Landschaft für wenige Minuten verwandelt, und die Planung, die nötig ist, um genau diesen Moment einzufangen.",
          expo:"Ausstellung · Immathalle der TUM, München", dates:"10.–22. November 2026 · täglich 10–19 Uhr" },
    en: { kicker:"Landscape Photography", subtitle:"The Art of Landscape Photography", mail:"E-mail", save:"Save contact",
          gallery:"A selection from the exhibition", seeGallery:"Photos from the exhibition",
          hello:"I'd love to hear from you!",
          bio:"For nine years I have been photographing landscapes and mountains. What fascinates me is the light that transforms a landscape for just a few minutes, and the planning it takes to capture exactly that moment.",
          expo:"Exhibition · Immathalle, TUM, Munich", dates:"10–22 November 2026 · daily 10 am – 7 pm" },
    pl: { kicker:"Fotografia krajobrazowa", subtitle:"The Art of Landscape Photography", mail:"E-mail", save:"Zapisz kontakt",
          gallery:"Wybór zdjęć z wystawy", seeGallery:"Zdjęcia z wystawy",
          hello:"Będzie mi miło, jeśli się odezwiesz!",
          bio:"Od dziewięciu lat fotografuję krajobrazy i góry. Fascynuje mnie światło, które na kilka minut odmienia krajobraz, a także planowanie, którego wymaga uchwycenie właśnie tej chwili.",
          expo:"Wystawa · Immathalle TUM, Monachium", dates:"10–22 listopada 2026 · codziennie 10–19" },
    es: { kicker:"Fotografía de paisaje", subtitle:"The Art of Landscape Photography", mail:"Correo", save:"Guardar contacto",
          gallery:"Una selección de la exposición", seeGallery:"Fotos de la exposición",
          hello:"¡Me encantará saber de ti!",
          bio:"Desde hace nueve años fotografío paisajes y montañas. Me fascina la luz que transforma un paisaje durante apenas unos minutos, así como la planificación necesaria para captar justo ese momento.",
          expo:"Exposición · Immathalle, TUM, Múnich", dates:"10–22 de noviembre de 2026 · todos los días 10–19 h" },
    pt: { kicker:"Fotografia de paisagem", subtitle:"The Art of Landscape Photography", mail:"E-mail", save:"Salvar contato",
          gallery:"Uma seleção da exposição", seeGallery:"Fotos da exposição",
          hello:"Vou adorar receber sua mensagem!",
          bio:"Há nove anos fotografo paisagens e montanhas. Me fascina a luz que transforma uma paisagem por apenas alguns minutos, assim como o planejamento necessário para capturar exatamente esse momento.",
          expo:"Exposição · Immathalle, TUM, Munique", dates:"10–22 de novembro de 2026 · diariamente, 10h–19h" },
    it: { kicker:"Fotografia di paesaggio", subtitle:"The Art of Landscape Photography", mail:"E-mail", save:"Salva contatto",
          gallery:"Una selezione dalla mostra", seeGallery:"Foto della mostra",
          hello:"Sarò felice di ricevere un tuo messaggio!",
          bio:"Da nove anni fotografo paesaggi e montagne. Mi affascina la luce che per pochi minuti trasforma un paesaggio, così come la pianificazione necessaria per cogliere proprio quel momento.",
          expo:"Mostra · Immathalle, TUM, Monaco di Baviera", dates:"10–22 novembre 2026 · tutti i giorni 10–19" },
    fr: { kicker:"Photographie de paysage", subtitle:"The Art of Landscape Photography", mail:"E-mail", save:"Enregistrer le contact",
          gallery:"Une sélection de l'exposition", seeGallery:"Photos de l'exposition",
          hello:"Je serai ravi de recevoir votre message\u202F!",
          bio:"Depuis neuf ans, je photographie des paysages et des montagnes. Ce qui me fascine, c'est la lumière qui transforme un paysage pendant quelques minutes à peine, ainsi que la préparation nécessaire pour saisir précisément cet instant.",
          expo:"Exposition · Immathalle, TUM, Munich", dates:"10–22 novembre 2026 · tous les jours 10h–19h" }
  };
  var FLAG = { de:"🇩🇪", en:"🇬🇧", pl:"🇵🇱", es:"🇪🇸", pt:"🇧🇷", it:"🇮🇹", fr:"🇫🇷" };
  function setLang(l) {
    if (!T[l]) l = "en";
    document.documentElement.lang = l;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = T[l][el.dataset.i18n]; });
    document.querySelector(".lang select").value = l;
    document.querySelector(".lang-flag").textContent = FLAG[l];
    document.querySelector(".lang-code").textContent = l.toUpperCase();
    try { localStorage.setItem("lang", l); } catch (e) {}
  }
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("lang"); } catch (e) {}
    var pick = saved;
    if (!pick) {
      var prefs = navigator.languages || [navigator.language || "en"];
      for (var i = 0; i < prefs.length && !pick; i++) {
        var c = (prefs[i] || "").slice(0, 2).toLowerCase();
        if (T[c]) pick = c;
      }
    }
    setLang(pick || "en");
    document.querySelector(".lang select").addEventListener("change", function () { setLang(this.value); });
  })();
  (function () {
    var lb = document.querySelector(".lb"), big = lb.querySelector("img"), last = null;
    function close() {
      if (lb.hidden) return;
      lb.hidden = true; big.removeAttribute("src"); document.body.style.overflow = "";
      if (last) last.focus();
    }
    document.querySelectorAll(".grid a").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault(); last = a;
        big.src = a.getAttribute("href"); big.alt = a.querySelector("img").alt;
        lb.hidden = false; document.body.style.overflow = "hidden"; lb.focus();
      });
    });
    lb.addEventListener("click", close);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  })();
</script>
</body>
</html>
